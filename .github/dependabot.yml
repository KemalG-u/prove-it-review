# Dependabot version updates (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference).
# Keep the github-actions entry: it updates the SHA-pinned actions in .github/workflows/.
# This project has no third-party dependencies (standard library only), so only the actions are tracked.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
